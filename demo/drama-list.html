<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>漫剧列表 — 漫剧资源管理后台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#FFFEF8;--white:#FFF;--lemon:#FFC233;--lemon-light:#FFF3D0;
      --purple:#7C5CFC;--purple-light:#EDE8FF;--mint:#34D399;--mint-light:#D1FAE5;
      --coral:#FF6B6B;--coral-light:#FFE4E4;--black:#1A1A1A;--gray:#6B7280;--gray-light:#F3F4F6;
      --border:#1A1A1A;--shadow:4px 4px 0 #1A1A1A;--shadow-hover:6px 6px 0 #1A1A1A;
      --radius:14px;--radius-sm:10px;--radius-full:999px;
    }
    body{font-family:'Inter','Noto Sans SC',sans-serif;background:var(--bg);color:var(--black)}
    h1,.heading{font-family:'Space Grotesk','Noto Sans SC',sans-serif}
    .btn{border:2px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow);font-family:'Space Grotesk',sans-serif;font-weight:600;cursor:pointer;transition:transform .1s,box-shadow .1s;display:inline-flex;align-items:center;gap:6px}
    .btn:active{transform:translate(4px,4px);box-shadow:none}
    .btn-primary{background:var(--lemon)}.btn-primary:hover{background:#FFB800}
    .btn-secondary{background:var(--white)}.btn-secondary:hover{background:var(--gray-light)}
    .input-field{border:2px solid var(--border);border-radius:var(--radius-sm);background:var(--white);outline:none;transition:box-shadow .15s}
    .input-field:focus{box-shadow:var(--shadow)}
    .filter-pill{border:2px solid var(--border);border-radius:var(--radius-full);font-weight:600;cursor:pointer;transition:all .1s;font-size:13px}
    .filter-pill.active{background:var(--black);color:var(--bg)}
    .filter-pill:not(.active):hover{background:var(--lemon-light)}
    .sort-btn{cursor:pointer;font-weight:600;font-size:13px;padding:4px 12px;border:2px solid var(--border);border-radius:var(--radius-full);transition:all .1s;background:var(--white)}
    .sort-btn.active{background:var(--purple-light)}.sort-btn:hover{background:var(--lemon-light)}
    .status-badge{border:2px solid var(--border);border-radius:var(--radius-full);font-weight:700;font-size:11px;padding:2px 10px;white-space:nowrap}
    .card{background:var(--white);border:2px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;overflow:hidden;display:block;text-decoration:none;color:inherit}
    .card:hover{transform:translate(-2px,-2px);box-shadow:var(--shadow-hover)}
    .card:active{transform:translate(4px,4px);box-shadow:none}
    .page-btn{border:2px solid var(--border);border-radius:var(--radius-sm);box-shadow:3px 3px 0 #1A1A1A;font-weight:600;cursor:pointer;transition:transform .1s,box-shadow .1s;background:var(--white)}
    .page-btn:active{transform:translate(3px,3px);box-shadow:none}
    .page-btn.active{background:var(--black);color:var(--bg)}
    .lang-badge-wrap:hover .lang-tooltip{display:block!important}
    .lang-opt:hover{background:var(--lemon-light)}
    .toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-20px);opacity:0;z-index:200;display:flex;align-items:center;gap:10px;padding:14px 24px;font-weight:600;font-size:14px;border:2px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);pointer-events:none;transition:opacity .3s,transform .3s}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
    .toast-success{background:var(--mint-light)}
    .completion-chip{font-size:10px;font-weight:700;padding:1px 6px;border:1.5px solid var(--border);border-radius:var(--radius-full);white-space:nowrap;cursor:default}
    .completion-wrap:hover .completion-tooltip{display:block!important}
    .card-body{padding:10px 12px 12px}
    .title-block{display:flex;flex-direction:column;gap:2px}
    .author-line{font-size:12px;color:var(--gray);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .meta-stack{display:flex;flex-direction:column;gap:3px;margin-top:7px;padding-top:7px;border-top:1.5px solid var(--gray-light)}
    .meta-line{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--gray);white-space:nowrap;overflow:hidden}
    .meta-badge{display:inline-flex;align-items:center;height:18px;padding:0 7px;border:1.5px solid var(--border);border-radius:var(--radius-full);font-size:10px;font-weight:800;line-height:1;white-space:nowrap}
    .meta-date{font-size:11px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  </style>
</head>
<body class="min-h-screen">

<div id="toast" class="toast toast-success">
  <iconify-icon icon="lucide:check-circle-2" style="color:var(--mint)" class="text-xl"></iconify-icon>
  <span id="toast-msg">操作成功</span>
  <button onclick="hideToast()" style="cursor:pointer;margin-left:8px;background:none;border:none;font-size:18px;line-height:1;color:var(--gray)">×</button>
</div>

<header style="background:var(--white);border-bottom:2px solid var(--border)" class="px-8 py-4 flex items-center justify-between">
  <div class="flex items-center gap-3">
    <div class="w-10 h-10 flex items-center justify-center" style="background:var(--lemon);border:2px solid var(--border);border-radius:var(--radius-sm)">
      <iconify-icon icon="lucide:clapperboard" class="text-xl"></iconify-icon>
    </div>
    <span class="heading text-lg font-bold">漫剧管理后台</span>
    <nav class="flex items-center gap-1 ml-6">
      <a href="drama-list.html" class="text-sm font-semibold px-3 py-1 rounded-lg" style="background:var(--lemon-light);text-decoration:none;color:var(--black)">漫剧</a>
      <a href="tag-list.html" class="text-sm font-semibold px-3 py-1 rounded-lg" style="text-decoration:none;color:var(--gray)">标签</a>
      <a href="author-list.html" class="text-sm font-semibold px-3 py-1 rounded-lg" style="text-decoration:none;color:var(--gray)">作者</a>
    </nav>
  </div>
  <div class="flex items-center gap-3">
    <span class="text-sm font-medium" style="color:var(--gray)">Dean</span>
    <div class="w-9 h-9 flex items-center justify-center font-bold text-sm text-white" style="background:var(--purple);border:2px solid var(--border);border-radius:var(--radius-full)">D</div>
  </div>
</header>

<main class="max-w-[1400px] mx-auto px-8 py-8">
  <div class="flex items-end justify-between mb-6">
    <div>
      <h1 class="text-3xl font-bold tracking-tight mb-1">漫剧列表</h1>
      <p class="text-sm" style="color:var(--gray)">共 <span class="font-bold" style="color:var(--black)" id="total-count">60</span> 部漫剧 · 第 <span id="page-num">1</span>/<span id="total-pages">3</span> 页</p>
    </div>
    <a href="drama-detail.html?mode=create" class="btn btn-primary px-5 py-2.5 text-sm" style="text-decoration:none;color:var(--black)">
      <iconify-icon icon="lucide:plus" class="text-base"></iconify-icon>创建新剧

  <div class="flex flex-wrap items-center gap-4 mb-4">
    <div class="flex items-center gap-2">
      <button class="filter-pill px-4 py-1.5 active" data-filter="all" onclick="applyFilter(this)">全部</button>
      <button class="filter-pill px-4 py-1.5" data-filter="草稿" onclick="applyFilter(this)">草稿</button>
      <button class="filter-pill px-4 py-1.5" data-filter="已发布" onclick="applyFilter(this)">已发布</button>
      <button class="filter-pill px-4 py-1.5" data-filter="已下线" onclick="applyFilter(this)">已下线</button>
      <span style="color:var(--gray);margin:0 4px">|</span>
      <!-- Language filter: click to toggle -->
      <div class="relative" id="lang-filter-wrap">
        <button class="filter-pill px-4 py-1.5 flex items-center gap-1.5" id="lang-filter-btn" style="background:var(--white)" onclick="toggleLangDropdown(event)">
          <iconify-icon icon="lucide:globe" class="text-xs"></iconify-icon>
          <span id="lang-filter-label">全部语言</span>
          <iconify-icon icon="lucide:chevron-down" class="text-xs"></iconify-icon>
        </button>

          <button onclick="applyLang('ID')" class="lang-opt w-full text-left px-3 py-2 text-sm font-semibold rounded-lg flex items-center justify-between cursor-pointer">ID · Bahasa Indonesia <span class="text-xs font-bold" style="color:var(--gray)" id="lang-count-ID">0</span></button>
          <button onclick="applyLang('VI')" class="lang-opt w-full text-left px-3 py-2 text-sm font-semibold rounded-lg flex items-center justify-between cursor-pointer">VI · Tiếng Việt <span class="text-xs font-bold" style="color:var(--gray)" id="lang-count-VI">0</span></button>
          <button onclick="applyLang('TR')" class="lang-opt w-full text-left px-3 py-2 text-sm font-semibold rounded-lg flex items-center justify-between cursor-pointer">TR · Türkçe <span class="text-xs font-bold" style="color:var(--gray)" id="lang-count-TR">0</span></button>
          <button onclick="applyLang('RU')" class="lang-opt w-full text-left px-3 py-2 text-sm font-semibold rounded-lg flex items-center justify-between cursor-pointer">RU · Русский <span class="text-xs font-bold" style="color:var(--gray)" id="lang-count-RU">0</span></button>
        </div>
      </div>
    </div>
    <div class="flex-1"></div>
    <div class="input-field flex items-center gap-2 px-4 py-2 min-w-[240px]">
      <iconify-icon icon="lucide:search" style="color:var(--gray)"></iconify-icon>
      <input type="text" id="search" placeholder="搜索剧名、作者..." class="bg-transparent outline-none text-sm flex-1" oninput="applySearch()">
    </div>
  </div>

  <div class="flex items-center gap-2 mb-6">
    <span class="text-xs font-semibold" style="color:var(--gray)">排序:</span>
    <button class="sort-btn active" data-sort="updated" onclick="applySort(this)"><iconify-icon icon="lucide:clock" class="text-xs"></iconify-icon> 最近更新</button>
    <button class="sort-btn" data-sort="created" onclick="applySort(this)"><iconify-icon icon="lucide:calendar-plus" class="text-xs"></iconify-icon> 创建时间</button>
    <button class="sort-btn" data-sort="name" onclick="applySort(this)"><iconify-icon icon="lucide:arrow-down-a-z" class="text-xs"></iconify-icon> 剧名</button>
    <button class="sort-btn" data-sort="episodes" onclick="applySort(this)"><iconify-icon icon="lucide:list-video" class="text-xs"></iconify-icon> 集数</button>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-5 mb-10" id="grid"></div>

  <div class="flex items-center justify-center gap-2" id="pagination"></div>
</main>

  'https://thwztchapter.dramaboxdb.com/data/cppartner/4x2/42x0/420x0/42000005980/42000005980.jpg@w=300&h=400',
  'https://thwztchapter.dramaboxdb.com/data/cppartner/4x2/42x0/420x0/42000006342/42000006342.jpg@w=300&h=400',
  'https://thwztchapter.dramaboxdb.com/data/cppartner/4x2/42x0/420x0/42000005750/42000005750.jpg@w=300&h=400',
  'https://thwztchapter.dramaboxdb.com/data/cppartner/4x2/42x0/420x0/42000006248/42000006248.jpg@w=300&h=400',
  'https://thwztchapter.dramaboxdb.com/data/cppartner/4x2/42x0/420x0/42000005804/42000005804.jpg@w=300&h=400',
  'https://thwztchapter.dramaboxdb.com/data/cppartner/4x2/42x0/420x0/42000005808/42000005808.jpg@w=300&h=400',
  'https://thwztchapter.dramaboxdb.com/data/cppartner/4x2/42x0/420x0/42000005805/42000005805.jpg@w=300&h=400',
  'https://thwztchapter.dramaboxdb.com/data/cppartner/4x2/42x0/420x0/42000005806/42000005806.jpg@w=300&h=400',
  'https://thwztchapter.dramaboxdb.com/data/cppartner/4x2/42x0/420x0/42000006279/42000006279.jpg@w=300&h=400',
  'https://thwztchapter.dramaboxdb.com/data/cppartner/4x2/42x0/420x0/42000010079/42000010079.jpg@w=300&h=400',
  'https://thwztchapter.dramaboxdb.com/data/cppartner/4x2/42x0/420x0/42000010169/42000010169.jpg@w=300&h=400',
  'https://thwztchapter.dramaboxdb.com/data/cppartner/4x2/42x0/420x0/42000009739/42000009739.jpg@w=300&h=400',
  'https://thwztchapter.dramaboxdb.com/data/cppartner/4x2/42x0/420x0/42000010138/42000010138.jpg@w=300&h=400',
  'https://thwztchapter.dramaboxdb.com/data/cppartner/4x2/42x0/420x0/42000009986/42000009986.jpg@w=300&h=400',
  'https://thwztchapter.dramaboxdb.com/data/cppartner/4x2/42x0/420x0/42000010001/42000010001.jpg@w=300&h=400',
  'https://thwztchapter.dramaboxdb.com/data/cppartner/4x2/42x0/420x0/42000010004/42000010004.jpg@w=300&h=400',
  'https://thwztchapter.dramaboxdb.com/data/cppartner/4x2/42x0/420x0/42000010015/42000010015.jpg@w=300&h=400',
  'https://thwztchapter.dramaboxdb.com/data/cppartner/4x2/42x0/420x0/42000010073/42000010073.jpg@w=300&h=400',
  'https://thwztchapter.dramaboxdb.com/data/cppartner/4x2/42x0/420x0/42000009874/42000009874.jpg@w=300&h=400',
  'https://thwztchapter.dramaboxdb.com/data/cppartner/4x2/42x0/420x0/42000009976/42000009976.jpg@w=300&h=400',
  'https://thwztchapter.dramaboxdb.com/data/cppartner/4x2/42x0/420x0/42000010141/42000010141.jpg@w=300&h=400',
];

const allDramas = [];
for (let i = 0; i < 60; i++) {
  const d = new Date(2025, 6 + Math.floor(i/5), 1 + (i % 28));
  const u = new Date(2026, 3, 22 - Math.floor(i * 0.4), 9 + (i % 8), (11 + i * 5) % 60);
  const totalEps = 4 + Math.floor(Math.random() * 44);
  const langCount = 1 + Math.floor(Math.random() * 3);
  const subtitleTotal = totalEps * langCount;
  let videoUp, langComplete, subtitleUp;
  if (i % 5 === 0) {
    videoUp = totalEps; langComplete = langCount; subtitleUp = subtitleTotal;
  } else if (i % 3 === 0) {
    videoUp = totalEps; langComplete = Math.max(1, Math.floor(langCount * 0.6)); subtitleUp = Math.floor(subtitleTotal * 0.7);
  } else if (i % 2 === 0) {
    videoUp = Math.floor(totalEps * 0.6); langComplete = langCount; subtitleUp = Math.floor(subtitleTotal * 0.5);
  } else {
    videoUp = Math.floor(totalEps * 0.3); langComplete = Math.max(0, Math.floor(langCount * 0.3)); subtitleUp = Math.floor(subtitleTotal * 0.15);
  }
  allDramas.push({
    id: i, title: titles[i], author: authors[i % authors.length],
    status: statuses[i % 3 === 0 ? 0 : (i % 5 === 0 ? 2 : (i % 2 === 0 ? 0 : 1))],
    episodes: totalEps,
    created: d.toISOString().slice(0,10),
    updated: formatDateTime(u),
    seed: 'reelshort' + (i + 1),
    cover: covers[i % covers.length],
    seriesId: 1000001 + i,
    lang: langs[i % langs.length],
    orientation: orientations[i % orientations.length],
    source: sources[i % sources.length],
    productionMode: productionModes[i % productionModes.length],
    supportedLangs: [langs[i % langs.length], ...(['EN','ZH','JA','KO','ES'].filter(l => l !== langs[i % langs.length]).slice(0, Math.floor(Math.random()*3)))],
    videoUploaded: videoUp,
    subtitleUploaded: subtitleUp,
    subtitleTotal: subtitleTotal,
    langConfigured: langCount,
    // 语言配置完成 = 剧集名 + 封面 + 简介均已完成；Banner 不纳入当前 P0。
    langComplete: langComplete
  });
}
allDramas.forEach(d => { if (d.status === '已发布') d.episodes = Math.max(d.episodes, 12); });

function formatDateTime(date) {
  const pad = n => String(n).padStart(2, '0');
  return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()) + ' ' + pad(date.getHours()) + ':' + pad(date.getMinutes());
}

function getFiltered() {
  let list = [...allDramas];
  if (currentFilter !== 'all') list = list.filter(d => d.status === currentFilter);
  if (currentLang !== 'all') list = list.filter(d => d.supportedLangs && d.supportedLangs.includes(currentLang));
  if (currentSearch) {
    const q = currentSearch.toLowerCase();
    list = list.filter(d => (d.title + d.author).toLowerCase().includes(q));
  }
  list.sort((a, b) => {
    let cmp = 0;
    if (currentSort === 'updated') cmp = b.updated.localeCompare(a.updated);
    else if (currentSort === 'created') cmp = b.created.localeCompare(a.created);
    else if (currentSort === 'name') cmp = a.title.localeCompare(b.title);
    else if (currentSort === 'episodes') cmp = b.episodes - a.episodes;
    return currentSortDir === 'desc' ? cmp : -cmp;
  });
  return list;
}

function render() {
  const list = getFiltered();
  const totalPages = Math.max(1, Math.ceil(list.length / PER_PAGE));
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * PER_PAGE;
  const page = list.slice(start, start + PER_PAGE);

  document.getElementById('total-count').textContent = list.length;
  document.getElementById('page-num').textContent = currentPage;
  document.getElementById('total-pages').textContent = totalPages;

  const grid = document.getElementById('grid');
  grid.innerHTML = page.map(d => `
    <a href="drama-detail.html?id=${d.seriesId}" class="card">
      <div style="aspect-ratio:3/4;background:var(--gray-light);border-bottom:2px solid var(--border);overflow:hidden;position:relative">
        <img src="${d.cover}" alt="${d.title}" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none'">
        <div class="lang-badge-wrap" style="position:absolute;top:6px;left:6px;z-index:5">
          <span style="background:var(--black);color:var(--bg);font-size:10px;font-weight:700;padding:2px 7px;border-radius:var(--radius-full);border:2px solid var(--border);cursor:default;display:inline-block">${d.lang}</span>
          <div class="lang-tooltip" style="display:none;position:absolute;top:calc(100% + 4px);left:0;background:var(--white);border:2px solid var(--border);border-radius:var(--radius-sm);box-shadow:3px 3px 0 var(--border);padding:6px 8px;white-space:nowrap;z-index:10">
            <div style="font-size:10px;font-weight:700;color:var(--gray);margin-bottom:4px">支持语种</div>
            <div style="display:flex;flex-wrap:wrap;gap:4px">
              ${d.supportedLangs.map(l => '<span style="font-size:10px;font-weight:700;padding:1px 6px;border-radius:var(--radius-full);border:2px solid var(--border);background:' + (l===d.lang?'var(--black);color:var(--bg)':'var(--white)') + '">' + l + '</span>').join('')}
            </div>
          </div>
        </div>
        <span style="position:absolute;top:6px;right:6px;background:var(--white);padding:3px;border-radius:6px;border:2px solid var(--border);line-height:0">
          <iconify-icon icon="${d.orientation==='竖屏'?'lucide:smartphone':'lucide:monitor'}" style="font-size:14px"></iconify-icon>
        </span>
        <div style="position:absolute;bottom:0;left:0;right:0;padding:6px 10px;background:linear-gradient(transparent,rgba(0,0,0,.6))">
          <span class="status-badge" style="background:${statusColors[d.status]};font-size:10px;padding:1px 8px">${d.status}</span>
        </div>
      </div>
      <div class="card-body">
        <div class="title-block">
          <div class="heading" style="font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${d.title}">${d.title}</div>
          <div style="font-size:11px;color:#aaa">#${d.seriesId}</div>
        </div>
        <div class="author-line" title="${d.author}">${d.author}</div>
        <div class="meta-stack" title="${d.episodes}集 · ${d.source} · ${d.productionMode} · ${d.updated}">
          <div class="meta-line">
            <span>${d.episodes}集</span><span>·</span>
            <span class="meta-badge" style="${sourceStyles[d.source]}">${sourceLabels[d.source]}</span><span>·</span>
            <span class="meta-badge" style="${productionModeStyles[d.productionMode]}">${d.productionMode}</span>
          </div>
          <div class="meta-date">${d.updated}</div>
        </div>
        ${(()=>{
            if (d.episodes === 0) {
              return '<div class="completion-wrap" style="margin-top:6px;position:relative">'
                + '<span class="completion-chip" style="background:var(--mint-light);border-color:var(--mint)">✓ 已就绪</span>'
                + '<div class="completion-tooltip" style="display:none;position:absolute;bottom:calc(100% + 6px);left:0;background:var(--white);border:2px solid var(--border);border-radius:var(--radius-sm);box-shadow:3px 3px 0 var(--border);padding:8px 10px;white-space:nowrap;z-index:10;font-size:11px;min-width:140px">'
                + '<div style="display:flex;justify-content:space-between;gap:12px"><span>视频</span><span style="font-weight:700;color:var(--mint)">0/0 (—)</span></div>'
                + '<div style="display:flex;justify-content:space-between;gap:12px"><span>字幕</span><span style="font-weight:700;color:var(--mint)">0/0 (—)</span></div>'
                + '<div style="display:flex;justify-content:space-between;gap:12px"><span>语言</span><span style="font-weight:700;color:var(--mint)">0/0 (—)</span></div>'
                + '</div></div>';
            }
            const vPct = d.episodes > 0 ? Math.round(d.videoUploaded / d.episodes * 100) : 0;
            const sPct = d.subtitleTotal > 0 ? Math.round(d.subtitleUploaded / d.subtitleTotal * 100) : 0;
            const lPct = d.langConfigured > 0 ? Math.round(d.langComplete / d.langConfigured * 100) : 0;
            const dims = [{label:'视频',pct:vPct,detail:d.videoUploaded+'/'+d.episodes},{label:'字幕',pct:sPct,detail:d.subtitleUploaded+'/'+d.subtitleTotal},{label:'语言',pct:lPct,detail:d.langComplete+'/'+d.langConfigured}];
            const allDone = dims.every(x => x.pct >= 100);
            const tooltipRows = dims.map(x => '<div style="display:flex;justify-content:space-between;gap:12px"><span>'+x.label+'</span><span style="font-weight:700;color:'+(x.pct>=100?'var(--mint)':x.pct>=50?'var(--lemon)':'var(--coral)')+'">'+x.detail+' ('+x.pct+'%)</span></div>').join('');
            if (allDone) {
              return '<div class="completion-wrap" style="margin-top:6px;position:relative">'
                + '<span class="completion-chip" style="background:var(--mint-light);border-color:var(--mint)">✓ 已就绪</span>'
                + '<div class="completion-tooltip" style="display:none;position:absolute;bottom:calc(100% + 6px);left:0;background:var(--white);border:2px solid var(--border);border-radius:var(--radius-sm);box-shadow:3px 3px 0 var(--border);padding:8px 10px;white-space:nowrap;z-index:10;font-size:11px;min-width:140px">' + tooltipRows + '</div>'
                + '</div>';
            } else {
              const worst = dims.filter(x=>x.pct<100).sort((a,b)=>a.pct-b.pct||dims.indexOf(a)-dims.indexOf(b))[0];
              const worstColor = worst.pct >= 50 ? 'background:var(--lemon-light);border-color:var(--lemon)' : 'background:var(--coral-light);border-color:var(--coral)';
              return '<div class="completion-wrap" style="margin-top:6px;position:relative">'
                + '<span class="completion-chip" style="' + worstColor + '">' + worst.label + ' ' + worst.pct + '%</span>'
                + '<div class="completion-tooltip" style="display:none;position:absolute;bottom:calc(100% + 6px);left:0;background:var(--white);border:2px solid var(--border);border-radius:var(--radius-sm);box-shadow:3px 3px 0 var(--border);padding:8px 10px;white-space:nowrap;z-index:10;font-size:11px;min-width:140px">' + tooltipRows + '</div>'
                + '</div>';
            }
          })()}
      </div>
    </a>
  `).join('');

  const pag = document.getElementById('pagination');
  let html = `<button class="page-btn w-9 h-9 flex items-center justify-center text-sm" onclick="goPage(${currentPage - 1})" ${currentPage===1?'disabled style="opacity:.4;cursor:default"':''}><iconify-icon icon="lucide:chevron-left"></iconify-icon></button>`;
  for (let i = 1; i <= totalPages; i++) {
    html += `<button class="page-btn w-9 h-9 flex items-center justify-center text-sm ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
  }
  html += `<button class="page-btn w-9 h-9 flex items-center justify-center text-sm" onclick="goPage(${currentPage + 1})" ${currentPage===totalPages?'disabled style="opacity:.4;cursor:default"':''}><iconify-icon icon="lucide:chevron-right"></iconify-icon></button>`;
  html += `<span style="margin-left:8px;font-size:13px;color:var(--gray)">跳至 <input type="number" min="1" max="${totalPages}" value="${currentPage}" onkeydown="if(event.key==='Enter')goPage(parseInt(this.value))" style="width:48px;border:2px solid var(--border);border-radius:var(--radius-sm);text-align:center;padding:2px 4px;font-size:13px;font-weight:600;outline:none"> 页</span>`;
  pag.innerHTML = html;

  // Update lang counts
  const langCounts = {all: allDramas.length, EN:0, ZH:0, JA:0, KO:0, ES:0, FR:0, TH:0, PT:0, DE:0, AR:0, HI:0, ID:0, VI:0, TR:0, RU:0};
  allDramas.forEach(d => { if (d.supportedLangs) d.supportedLangs.forEach(l => { if (langCounts[l] !== undefined) langCounts[l]++; }); });
  Object.keys(langCounts).forEach(k => {
    const el = document.getElementById('lang-count-' + k);
    if (el) el.textContent = langCounts[k];
  });
}

function goPage(n) {
  const total = Math.ceil(getFiltered().length / PER_PAGE);
  if (n < 1 || n > total) return;
  currentPage = n;
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}
function applyFilter(btn) {
  document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = btn.dataset.filter;
  currentPage = 1;
  render();
}
function applySearch() {
  currentSearch = document.getElementById('search').value;
  currentPage = 1;
  if (!currentSearch) {
    currentFilter = 'all';
    document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
    document.querySelector('[data-filter="all"]').classList.add('active');
  }
  render();
}
function applySort(btn) {
  const sort = btn.dataset.sort;
  if (currentSort === sort) {
    currentSortDir = currentSortDir === 'desc' ? 'asc' : 'desc';
  } else {
    currentSort = sort;
    currentSortDir = 'desc';
  }
  document.querySelectorAll('.sort-btn').forEach(b => {
    b.classList.remove('active');
    const arrow = b.querySelector('.sort-arrow');
    if (arrow) arrow.remove();
  });
  btn.classList.add('active');
  const arrow = document.createElement('span');
  arrow.className = 'sort-arrow';
  arrow.textContent = currentSortDir === 'desc' ? ' ↓' : ' ↑';
  btn.appendChild(arrow);
  currentPage = 1;
  render();
}
function applyLang(lang) {
  currentLang = lang;
  currentPage = 1;
  document.getElementById('lang-filter-label').textContent = langNames[lang] || lang;
  document.querySelectorAll('.lang-opt').forEach(b => b.style.background = '');
  if (event && event.target) {
    const opt = event.target.closest('.lang-opt');
    if (opt) opt.style.background = 'var(--lemon-light)';
  }
  const btn = document.getElementById('lang-filter-btn');
  if (lang === 'all') { btn.classList.remove('active'); btn.style.background = 'var(--white)'; }
  else { btn.classList.add('active'); btn.style.background = 'var(--purple-light)'; }
  document.getElementById('lang-dropdown').style.display = 'none';
  render();
}
function toggleLangDropdown(e) {
  e.stopPropagation();
  const dd = document.getElementById('lang-dropdown');
  dd.style.display = dd.style.display === 'none' ? 'block' : 'none';
}
document.addEventListener('click', function(e) {
  const wrap = document.getElementById('lang-filter-wrap');
  if (wrap && !wrap.contains(e.target)) {
    document.getElementById('lang-dropdown').style.display = 'none';
  }
});

// Init sort arrow
document.querySelector('.sort-btn.active').appendChild(Object.assign(document.createElement('span'), {className:'sort-arrow', textContent:' ↓'}));
render();
const toastMsgs = {
  episodes_added: '剧集添加成功，共添加 4 集',
  drama_saved: '漫剧已保存',
  drama_published: '漫剧已发布',
};
function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 4000);
}
function hideToast() { document.getElementById('toast').classList.remove('show'); }
const params = new URLSearchParams(location.search);
const toastKey = params.get('toast');
if (toastKey && toastMsgs[toastKey]) {
  showToast(toastMsgs[toastKey]);
  try { history.replaceState(null, '', location.pathname); } catch(e) {}
}
</script>
</body>
</html>
