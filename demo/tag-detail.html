<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>标签详情 — 漫剧资源管理后台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#FFFEF8;--white:#FFF;--lemon:#FFC233;--lemon-light:#FFF3D0;--purple:#7C5CFC;--purple-light:#EDE8FF;--mint:#34D399;--mint-light:#D1FAE5;--coral:#FF6B6B;--coral-light:#FFE4E4;--black:#1A1A1A;--gray:#6B7280;--gray-light:#F3F4F6;--border:#1A1A1A;--shadow:4px 4px 0 #1A1A1A;--radius:14px;--radius-sm:10px;--radius-full:999px}
    body{font-family:'Inter','Noto Sans SC',sans-serif;background:var(--bg);color:var(--black)}
    h1,h2,.heading{font-family:'Space Grotesk','Noto Sans SC',sans-serif}
    .box{background:var(--white);border:2px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
    .btn{border:2px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow);font-family:'Space Grotesk',sans-serif;font-weight:600;cursor:pointer;transition:transform .1s,box-shadow .1s;display:inline-flex;align-items:center;gap:6px}
    .btn:active{transform:translate(4px,4px);box-shadow:none}
    .btn-primary{background:var(--lemon)}.btn-primary:hover{background:#FFB800}
    .btn-secondary{background:var(--white)}.btn-secondary:hover{background:var(--gray-light)}
    .input-field{border:2px solid var(--border);border-radius:var(--radius-sm);background:var(--white);outline:none;transition:box-shadow .15s}
    .input-field:focus{box-shadow:var(--shadow)}
    .toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-20px);opacity:0;z-index:200;display:flex;align-items:center;gap:10px;padding:14px 24px;font-weight:600;font-size:14px;border:2px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);pointer-events:none;transition:opacity .3s,transform .3s}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
    .toast-success{background:var(--mint-light)}
    .modal-overlay{position:fixed;inset:0;background:rgba(26,26,26,0.5);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s}
    .modal-overlay.active{opacity:1;pointer-events:auto}
    .modal-box{background:var(--white);border:2px solid var(--border);border-radius:var(--radius);box-shadow:8px 8px 0px #1A1A1A;max-width:420px;width:92%}
    .tbl{width:100%;border-collapse:collapse}
    .tbl th{text-align:left;padding:10px 12px;font-size:12px;font-weight:700;border-bottom:2px solid var(--border);background:var(--gray-light)}
    .tbl td{padding:10px 12px;border-bottom:2px solid var(--border);vertical-align:middle}
    .tbl tr:last-child td{border-bottom:none}
  </style>
</head>
<body class="min-h-screen">

<div id="toast" class="toast toast-success">
  <iconify-icon icon="lucide:check-circle-2" style="color:var(--mint)" class="text-xl"></iconify-icon>
  <span id="toast-msg">操作成功</span>
</div>

<header style="background:var(--white);border-bottom:2px solid var(--border)" class="px-8 py-4 flex items-center justify-between">
  <div class="flex items-center gap-3">
    <div class="w-10 h-10 flex items-center justify-center" style="background:var(--lemon);border:2px solid var(--border);border-radius:var(--radius-sm)">
      <iconify-icon icon="lucide:clapperboard" class="text-xl"></iconify-icon>
    </div>
    <span class="heading text-lg font-bold">漫剧管理后台</span>
    <nav class="flex items-center gap-1 ml-6">
      <a href="drama-list.html" class="text-sm font-semibold px-3 py-1 rounded-lg" style="text-decoration:none;color:var(--gray)">漫剧</a>
      <a href="tag-list.html" class="text-sm font-semibold px-3 py-1 rounded-lg" style="background:var(--lemon-light);text-decoration:none;color:var(--black)">标签</a>
      <a href="author-list.html" class="text-sm font-semibold px-3 py-1 rounded-lg" style="text-decoration:none;color:var(--gray)">作者</a>
    </nav>
  </div>
  <div class="flex items-center gap-3">
    <span class="text-sm font-medium" style="color:var(--gray)">Dean</span>
    <div class="w-9 h-9 flex items-center justify-center font-bold text-sm text-white" style="background:var(--purple);border:2px solid var(--border);border-radius:var(--radius-full)">D</div>
  </div>
</header>

<main class="max-w-[800px] mx-auto px-8 py-8">
  <a href="tag-list.html" class="inline-flex items-center gap-1.5 text-sm font-semibold mb-4 hover:underline" style="text-decoration:none;color:var(--gray)">
    <iconify-icon icon="lucide:arrow-left"></iconify-icon>返回标签列表
  </a>
  <h1 id="page-title" class="text-3xl font-bold tracking-tight heading mb-8">新建标签</h1>

  <div class="box p-6">
    <div class="mb-6">
      <label class="block text-sm font-semibold mb-1.5">Tag 名 <span style="color:var(--coral)">*</span></label>
      <input type="text" id="tag-name" class="input-field w-full px-4 py-2.5 text-sm" placeholder="输入标签英文名称">
    </div>

    <div>
      <div class="flex items-center justify-between mb-3">
        <h2 class="heading text-base font-bold">多语言翻译</h2>
        <button class="btn btn-secondary px-3 py-1.5 text-xs" onclick="addRow()">
          <iconify-icon icon="lucide:plus" class="text-xs"></iconify-icon>添加语言翻译
        </button>
      </div>
      <div class="box overflow-hidden" style="box-shadow:none">
        <table class="tbl">
          <thead>
            <tr><th style="width:200px">语言</th><th>翻译</th><th style="width:60px;text-align:center">操作</th></tr>
          </thead>
          <tbody id="trans-tbody"></tbody>
        </table>
      </div>
      <div id="empty-hint" class="text-center py-8">
        <iconify-icon icon="lucide:languages" class="text-3xl mb-2" style="color:var(--gray)"></iconify-icon>
        <div class="text-sm" style="color:var(--gray)">点击「添加语言翻译」开始配置多语言</div>
      </div>
    </div>
  </div>

  <div class="flex items-center justify-end gap-3 mt-6">
    <button class="btn btn-secondary px-5 py-2.5 text-sm" onclick="location.href='tag-list.html'">取消</button>
    <button class="btn btn-primary px-5 py-2.5 text-sm" onclick="saveTag()">保存</button>
  </div>
</main>

<div id="confirm-modal" class="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="flex items-center justify-between p-5" style="border-bottom:2px solid var(--border)">
      <h3 class="heading font-bold text-lg">移除语言</h3>
      <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center cursor-pointer" style="border:2px solid var(--border);border-radius:var(--radius-sm);background:var(--white)"><iconify-icon icon="lucide:x" class="text-sm"></iconify-icon></button>
    </div>
    <div class="p-5">
      <p id="modal-msg" class="text-sm mb-5"></p>
      <div class="flex justify-end gap-3">
        <button onclick="closeModal()" class="btn btn-secondary px-5 py-2 text-sm">取消</button>
        <button id="modal-ok" class="btn px-5 py-2 text-sm" style="background:var(--coral);color:#fff">确认移除</button>
      </div>
    </div>
  </div>
</div>

<script>
const ALL_LANGS = [
  {code:'EN',name:'English'},{code:'ZH',name:'中文'},{code:'JA',name:'日本語'},
  {code:'KO',name:'한국어'},{code:'ES',name:'Español'},{code:'FR',name:'Français'},
  {code:'TH',name:'ภาษาไทย'},{code:'PT',name:'Português'},{code:'DE',name:'Deutsch'},
  {code:'AR',name:'العربية'},{code:'HI',name:'हिन्दी'},{code:'ID',name:'Bahasa Indonesia'},
  {code:'VI',name:'Tiếng Việt'},{code:'TR',name:'Türkçe'},{code:'RU',name:'Русский'},
];

let translations = [];

function langHue(code) { let h=0; for(let i=0;i<code.length;i++) h=code.charCodeAt(i)+((h<<5)-h); return Math.abs(h)%360; }
function langFg(code) { return `hsl(${langHue(code)}, 70%, 35%)`; }

function getUsedLangs() { return translations.map(t => t.lang); }
function getAvailableLangs() { return ALL_LANGS.filter(l => !getUsedLangs().includes(l.code)); }

function render() {
  const tbody = document.getElementById('trans-tbody');
  const hint = document.getElementById('empty-hint');
  if (translations.length === 0) {
    tbody.innerHTML = '';
    hint.style.display = '';
    return;
  }
  hint.style.display = 'none';
  tbody.innerHTML = translations.map((t, i) => {
    const lang = ALL_LANGS.find(l => l.code === t.lang);
    return `<tr>
      <td>
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full shrink-0" style="background:hsl(${langHue(t.lang)},65%,50%)"></span>
          <span class="font-bold text-sm" style="color:${langFg(t.lang)}">${t.lang}</span>
          <span class="text-xs" style="color:var(--gray)">${lang ? lang.name : t.lang}</span>
        </div>
      </td>
      <td><input type="text" class="input-field w-full px-3 py-2 text-sm" value="${t.value}" oninput="translations[${i}].value=this.value" placeholder="输入翻译..."></td>
      <td class="text-center"><button class="text-sm font-bold cursor-pointer" style="color:var(--coral);background:none;border:none" onclick="removeRow(${i})">×</button></td>
    </tr>`;
  }).join('');
}

function addRow() {
  const available = getAvailableLangs();
  if (available.length === 0) { showToast('所有语言已添加'); return; }
  const lang = available[0];
  translations.push({lang: lang.code, value: ''});
  render();
  // Focus the new input
  setTimeout(() => {
    const inputs = document.querySelectorAll('#trans-tbody input');
    if (inputs.length > 0) inputs[inputs.length - 1].focus();
  }, 50);
}

function removeRow(idx) {
  const lang = translations[idx].lang;
  const langObj = ALL_LANGS.find(l => l.code === lang);
  document.getElementById('modal-msg').textContent = `确定移除「${lang} ${langObj ? langObj.name : ''}」的翻译吗？`;
  document.getElementById('modal-ok').onclick = () => {
    translations.splice(idx, 1);
    render();
    closeModal();
  };
  document.getElementById('confirm-modal').classList.add('active');
}

function closeModal() { document.getElementById('confirm-modal').classList.remove('active'); }

function saveTag() {
  const name = document.getElementById('tag-name').value.trim();
  if (!name) {
    document.getElementById('tag-name').style.borderColor = 'var(--coral)';
    document.getElementById('tag-name').style.boxShadow = '0 0 0 3px var(--coral-light)';
    document.getElementById('tag-name').focus();
    showToast('请填写标签名');
    return;
  }
  location.href = 'tag-list.html?toast=tag_saved';
}

function showToast(msg) {
  document.getElementById('toast-msg').textContent = msg;
  document.getElementById('toast').classList.add('show');
  setTimeout(() => document.getElementById('toast').classList.remove('show'), 3000);
}

// Edit mode
if (!new URLSearchParams(location.search).get('mode')) {
  document.getElementById('page-title').textContent = '编辑标签: Mafia';
  document.getElementById('tag-name').value = 'Mafia';
  translations = [
    {lang:'ZH', value:'黑手党'},
    {lang:'JA', value:'マフィア'},
    {lang:'KO', value:'마피아'},
    {lang:'ES', value:'Mafioso'},
  ];
}
render();
</script>
</body>
</html>
